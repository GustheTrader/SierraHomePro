<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sierra Home Pros — Residential Service & Dispatch Hub</title>
  <meta name="description" content="Operations and dispatch hub for Sierra Home Pros serving Reno-Sparks, Carson City, and Lake Tahoe with handyman repairs, smart-home installs, painting, maintenance plans, and senior safety upgrades." />
  <meta property="og:title" content="Sierra Home Pros — Residential Service & Dispatch Hub" />
  <meta property="og:description" content="Manage residential handyman repairs, written estimates, smart-home installations, painting, and senior home-safety upgrades across Reno-Sparks, Carson City, and Lake Tahoe." />
  <meta name="theme-color" content="#0B0D10" />
  <script>
    // Apply the saved theme before first paint (dark is the default) to avoid a flash.
    try {
      var t = localStorage.getItem('sierra_theme');
      document.documentElement.className = (t === 'light' || t === 'dark') ? t : 'dark';
    } catch (e) {}
  </script>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        /* "Field Ledger" system: near-square corners. Full rounding is kept only for dots and avatars. */
        borderRadius: {
          none: '0',
          sm: '1px',
          DEFAULT: '2px',
          md: '2px',
          lg: '2px',
          xl: '3px',
          '2xl': '3px',
          '3xl': '4px',
          full: '9999px',
        },
        extend: {
          fontFamily: {
            sans: ['Geist', 'ui-sans-serif', 'system-ui', 'sans-serif'],
            mono: ['"Geist Mono"', 'ui-monospace', 'monospace'],
            display: ['"Instrument Serif"', 'Georgia', 'serif'],
          },
          boxShadow: {
            /* Hard offset shadows instead of soft, blurry glows */
            sm: 'none',
            DEFAULT: 'none',
            md: '3px 3px 0 0 rgb(var(--c-shadow) / 0.35)',
            lg: '4px 4px 0 0 rgb(var(--c-shadow) / 0.35)',
            xl: '6px 6px 0 0 rgb(var(--c-shadow) / 0.4)',
            '2xl': '8px 8px 0 0 rgb(var(--c-shadow) / 0.45)',
          },
          colors: {
            zinc: {
              950: 'rgb(var(--c-bg) / <alpha-value>)',
              900: 'rgb(var(--c-surface) / <alpha-value>)',
              800: 'rgb(var(--c-border) / <alpha-value>)',
              700: 'rgb(var(--c-border-strong) / <alpha-value>)',
              600: 'rgb(var(--c-muted-strong) / <alpha-value>)',
              500: 'rgb(var(--c-muted) / <alpha-value>)',
              400: 'rgb(var(--c-text-secondary) / <alpha-value>)',
              300: 'rgb(var(--c-text-body) / <alpha-value>)',
              200: 'rgb(var(--c-text-strong) / <alpha-value>)',
              100: 'rgb(var(--c-text-primary) / <alpha-value>)',
              50:  'rgb(var(--c-text-peak) / <alpha-value>)',
            },
            emerald: {
              50:  'rgb(var(--c-brand-50) / <alpha-value>)',
              100: 'rgb(var(--c-brand-100) / <alpha-value>)',
              200: 'rgb(var(--c-brand-200) / <alpha-value>)',
              300: 'rgb(var(--c-brand-300) / <alpha-value>)',
              400: 'rgb(var(--c-brand-400) / <alpha-value>)',
              500: 'rgb(var(--c-brand-500) / <alpha-value>)',
              600: 'rgb(var(--c-brand-600) / <alpha-value>)',
              700: 'rgb(var(--c-brand-700) / <alpha-value>)',
              800: 'rgb(var(--c-brand-800) / <alpha-value>)',
              900: 'rgb(var(--c-brand-900) / <alpha-value>)',
            },
            sierra: {
              navy: '#132C47',
              'navy-hover': '#1C3D61',
              copper: '#B96626',
              'copper-hover': '#A0551C',
              cream: '#FAF8F5',
            }
          }
        }
      }
    };
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500;600&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
  <style>
    /* ── Field Ledger · Dark (default): graphite ink, paper-white type, one copper accent ── */
    :root,
    html.dark {
      --c-bg: 11 13 16;               /* #0B0D10 Graphite canvas */
      --c-surface: 17 20 24;          /* #111418 Panel */
      --c-border: 34 39 46;           /* #22272E Hairline rule */
      --c-border-strong: 52 59 69;    /* #343B45 Input / hover rule */
      --c-muted-strong: 88 97 109;
      --c-muted: 132 141 153;         /* #848D99 Labels */
      --c-text-secondary: 168 175 185;
      --c-text-body: 206 210 216;
      --c-text-strong: 230 232 235;
      --c-text-primary: 243 241 236;  /* #F3F1EC Paper white */
      --c-text-peak: 255 255 255;
      --c-shadow: 0 0 0;

      /* Copper accent: brighter and sharper on graphite */
      --c-brand-50: 38 22 12;
      --c-brand-100: 60 32 14;
      --c-brand-200: 104 54 20;
      --c-brand-300: 255 172 112;     /* Copper text on tinted fills */
      --c-brand-400: 240 130 56;      /* #F08238 Signal copper */
      --c-brand-500: 226 114 40;
      --c-brand-600: 196 90 24;       /* #C45A18 Buttons (white text) */
      --c-brand-700: 160 72 20;
      --c-brand-800: 122 56 17;
      --c-brand-900: 86 40 13;

      --chart-grid: #1c2128;
      --chart-axis: #848d99;
      --chart-tooltip-bg: #0b0d10;
      --chart-tooltip-border: #343b45;
      --chart-tooltip-text: #f3f1ec;
      --chart-primary: #8fa3b8;       /* Steel */
      --chart-secondary: #f08238;     /* Signal copper */
      --scroll-track: #0b0d10;
      --scroll-thumb: #2a3039;
      --scroll-thumb-hover: #3d4550;

      --grid-line: 255 255 255;
      --grid-alpha: 0.025;
    }

    /* ── Field Ledger · Light: drafting paper, navy ink, copper ── */
    html.light {
      --c-bg: 244 242 237;            /* #F4F2ED Drafting paper */
      --c-surface: 255 255 255;
      --c-border: 222 218 210;        /* #DEDAD2 */
      --c-border-strong: 190 184 174;
      --c-muted-strong: 128 136 146;
      --c-muted: 98 108 121;
      --c-text-secondary: 68 79 93;
      --c-text-body: 40 50 63;
      --c-text-strong: 24 33 45;
      --c-text-primary: 14 22 33;     /* #0E1621 Ink */
      --c-text-peak: 6 11 18;
      --c-shadow: 14 22 33;

      --c-brand-50: 252 243 235;
      --c-brand-100: 247 226 207;
      --c-brand-200: 236 196 162;
      --c-brand-300: 150 72 18;
      --c-brand-400: 180 92 28;       /* #B45C1C */
      --c-brand-500: 196 102 34;
      --c-brand-600: 180 88 24;
      --c-brand-700: 150 72 18;
      --c-brand-800: 118 56 15;
      --c-brand-900: 88 42 12;

      --chart-grid: #e4e0d8;
      --chart-axis: #626c79;
      --chart-tooltip-bg: #ffffff;
      --chart-tooltip-border: #0e1621;
      --chart-tooltip-text: #0e1621;
      --chart-primary: #0e1621;
      --chart-secondary: #b45c1c;
      --scroll-track: #ebe8e1;
      --scroll-thumb: #c4beb3;
      --scroll-thumb-hover: #a39c90;

      --grid-line: 14 22 33;
      --grid-alpha: 0.04;
    }

    /* High-contrast semantic status overrides for Light Mode readability */
    html.light .text-amber-300,
    html.light .text-amber-400 { color: #b45309 !important; }
    html.light .text-sky-300,
    html.light .text-sky-400 { color: #1d4ed8 !important; }
    html.light .text-red-300,
    html.light .text-red-400 { color: #b91c1c !important; }

    body {
      font-family: 'Geist', ui-sans-serif, system-ui, sans-serif;
      background-color: rgb(var(--c-bg));
      color: rgb(var(--c-text-primary));
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
      transition: background-color 0.2s ease, color 0.2s ease;
    }
    ::selection { background: rgb(var(--c-brand-400)); color: #fff; }

    /* Page titles: editorial serif against a technical UI */
    h1,
    h2.text-2xl, h2.text-3xl, h2.text-4xl {
      font-family: 'Instrument Serif', Georgia, serif !important;
      font-weight: 400 !important;
      font-size: 2.6rem !important;
      line-height: 1 !important;
      letter-spacing: -0.015em !important;
    }
    h2, h3, h4 { letter-spacing: -0.01em; }

    /* Data reads like an instrument: mono with tabular figures */
    .font-mono, .tabular-nums {
      font-family: 'Geist Mono', ui-monospace, monospace;
      font-variant-numeric: tabular-nums;
      letter-spacing: -0.01em;
    }
    /* Big KPI figures get tighter mono */
    :is(.text-2xl, .text-3xl, .text-4xl).font-bold:not(h1, h2, h3) {
      font-family: 'Geist Mono', ui-monospace, monospace;
      font-weight: 500 !important;
      letter-spacing: -0.04em;
      font-variant-numeric: tabular-nums;
    }

    /* Micro-labels become ledger column heads */
    .uppercase.tracking-wider,
    .uppercase.tracking-widest,
    .uppercase.tracking-wide {
      font-family: 'Geist Mono', ui-monospace, monospace;
      letter-spacing: 0.09em !important;
      font-weight: 500 !important;
    }

    /* No frosted glass: solid planes only */
    .backdrop-blur-sm, .backdrop-blur, .backdrop-blur-md, .backdrop-blur-lg, .backdrop-blur-xl {
      -webkit-backdrop-filter: none !important;
      backdrop-filter: none !important;
    }

    /* Crisp, visible keyboard focus */
    :focus-visible {
      outline: 1.5px solid rgb(var(--c-brand-400));
      outline-offset: 2px;
    }
    input:focus, textarea:focus, select:focus {
      border-color: rgb(var(--c-brand-400)) !important;
      box-shadow: none !important;
    }

    /* Faint survey grid behind the workspace */
    .ledger-grid {
      background-image:
        linear-gradient(rgb(var(--grid-line) / var(--grid-alpha)) 1px, transparent 1px),
        linear-gradient(90deg, rgb(var(--grid-line) / var(--grid-alpha)) 1px, transparent 1px);
      background-size: 32px 32px;
      background-position: -1px -1px;
    }

    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: var(--scroll-track); }
    ::-webkit-scrollbar-thumb { background: var(--scroll-thumb); border-radius: 0; }
    ::-webkit-scrollbar-thumb:hover { background: var(--scroll-thumb-hover); }
  </style>
<script type="importmap">
{
  "imports": {
    "react/": "https://esm.sh/react@^19.2.3/",
    "react": "https://esm.sh/react@^19.2.3",
    "lucide-react": "https://esm.sh/lucide-react@^0.563.0",
    "@google/genai": "https://esm.sh/@google/genai@^1.38.0",
    "react-dom/": "https://esm.sh/react-dom@^19.2.3/",
    "recharts": "https://esm.sh/recharts@^3.7.0"
  }
}
</script>
</head>
<body>
  <div id="root"></div>
<script type="module" src="/index.tsx"></script>
</body>
</html>
